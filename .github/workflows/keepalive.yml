# Keeps the OFFSTAGE Supabase project awake.
# Free Supabase projects pause after ~7 days without database activity.
# This calls a tiny keepalive() function once a day. If it ever fails,
# GitHub emails you and the run shows a red X under the Actions tab.
#
# The key below is the PUBLISHABLE key — it's designed to be public.
# Never put the secret / service_role key in this file.

name: Keep OFFSTAGE awake

on:
  schedule:
    - cron: "17 13 * * *"   # every day, ~9:17am New York time
  workflow_dispatch:         # adds a "Run workflow" button for testing

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping OFFSTAGE database
        env:
          SUPABASE_URL: https://lminpwotfjkztdhyakcj.supabase.co
          SUPABASE_KEY: sb_publishable_euixHakw36IYHCzszsgEwA_7zFdy7vr
        run: |
          for attempt in 1 2 3; do
            if curl --silent --show-error --fail --max-time 30 \
                 -X POST "$SUPABASE_URL/rest/v1/rpc/keepalive" \
                 -H "apikey: $SUPABASE_KEY" \
                 -H "Content-Type: application/json" \
                 -d '{}'; then
              echo ""
              echo "OFFSTAGE is awake."
              exit 0
            fi
            echo "Attempt $attempt failed, retrying in 20s…"
            sleep 20
          done
          echo "Could not reach OFFSTAGE. Check the Supabase dashboard — the project may be paused."
          exit 1
